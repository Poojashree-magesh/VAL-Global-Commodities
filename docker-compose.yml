version: "3.8"

services:
  backend:
    build: ./val-global-backend
    ports:
      - "8080:8080"
    environment:
      - SPRING_PROFILES_ACTIVE=prod
      - DB_URL=jdbc:mysql://db:3306/val_global_db?useSSL=false&allowPublicKeyRetrieval=true&serverTimezone=UTC
      - DB_USERNAME=root
      - DB_PASSWORD=pooja19
    depends_on:
      db:
        condition: service_healthy
  frontend:
    build: ./val-global-frontend
    ports:
      - "80:80"
  db:
    image: mysql:8.0
    environment:
      MYSQL_ROOT_PASSWORD: pooja19
      MYSQL_DATABASE: val_global_db
    ports:
      - "3306:3306"
    volumes:
      - mysql_data:/var/lib/mysql
    healthcheck:
      test: ["CMD", "mysqladmin", "ping", "-h", "localhost", "-ppooja19"]
      interval: 10s
      timeout: 5s
      retries: 10

volumes:
  mysql_data:
