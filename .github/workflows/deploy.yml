name: Deploy to GoDaddy

on:
  push:
    branches:
      - main # Trigger this whenever you push to the main branch

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: SSH and Deploy
        uses: appleboy/ssh-action@v1.2.5
        with:
          host: 118.139.179.249
          username: zcmtsivgo8mu
          password: ${{ secrets.SSH_PASSWORD }}
          port: 22
          script: |
            set -e
            cd /home/zcmtsivgo8mu/repositories/VAL-Global-Commodities
            git fetch origin
            # Sync local main to GitHub exactly (avoids divergent-branch pull failures).
            git checkout -B main origin/main
            # If cPanel runs git pull afterward, ff-only avoids silent merge commits.
            git config pull.ff only
            uapi VersionControlDeployment create repository_root=/home/zcmtsivgo8mu/repositories/VAL-Global-Commodities
