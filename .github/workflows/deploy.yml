name: Deploy to GoDaddy

on:
  push:
    branches:
      - main  # Trigger this whenever you push to the main branch

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v3

      - name: SSH and Deploy
        uses: appleboy/ssh-action@master
        with:
          host: 118.139.179.249
          username: zcmtsivgo8mu
          password: ${{ secrets.SSH_PASSWORD }}
          port: 22
          script: |
            # 1. Enter the repository folder
            cd /home/zcmtsivgo8mu/repositories/VAL-Global-Commodities
            
            # 2. Pull the latest code from GitHub
            git pull origin main
            
            # 3. Tell cPanel to run the .cpanel.yml deployment
            uapi VersionControlDeployment create repository_root=/home/zcmtsivgo8mu/repositories/VAL-Global-Commodities
