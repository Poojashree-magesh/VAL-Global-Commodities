# ============================================================
# VAL Global Commodities - Application Configuration
# ============================================================

# Server
server.port=${PORT:8080}
spring.application.name=val-global-backend

# ============================================================
# MySQL Database Configuration
# ============================================================
spring.datasource.url=${DB_URL:jdbc:mysql://localhost:3306/val_global_db?useSSL=false&allowPublicKeyRetrieval=true&serverTimezone=UTC}
spring.datasource.username=${DB_USERNAME:root}
spring.datasource.password=${DB_PASSWORD:pooja19}
spring.datasource.driver-class-name=${DB_DRIVER:com.mysql.cj.jdbc.Driver}

# JPA / Hibernate for MySQL
spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=true
spring.jpa.properties.hibernate.format_sql=true
spring.jpa.properties.hibernate.dialect=org.hibernate.dialect.MySQLDialect

# ============================================================
# Email Configuration
# Set SMTP_* env vars for Gmail, Brevo, SendGrid, Titan, etc.
# ============================================================
app.mail.enabled=${MAIL_ENABLED:false}
app.mail.from=${MAIL_FROM:${SMTP_USERNAME:}}
app.mail.to=${MAIL_TO:info@valglobalcommodities.com}
app.mail.brevo.api-key=${BREVO_API_KEY:}

spring.mail.host=${SMTP_HOST:smtp.titan.email}
spring.mail.port=${SMTP_PORT:587}
spring.mail.username=${SMTP_USERNAME:}
spring.mail.password=${SMTP_PASSWORD:}

# Core SMTP Settings
spring.mail.properties.mail.smtp.auth=true
spring.mail.properties.mail.smtp.starttls.enable=${SMTP_STARTTLS_ENABLE:true}
spring.mail.properties.mail.smtp.starttls.required=${SMTP_STARTTLS_REQUIRED:false}
spring.mail.properties.mail.smtp.ssl.enable=${SMTP_SSL_ENABLE:false}
spring.mail.properties.mail.smtp.ssl.trust=${SMTP_SSL_TRUST:${spring.mail.host}}
spring.mail.properties.mail.smtp.auth.mechanisms=${SMTP_AUTH_MECHANISMS:LOGIN PLAIN}
spring.mail.properties.mail.debug=${MAIL_DEBUG:false}

# Connection Timeouts
spring.mail.properties.mail.smtp.connectiontimeout=10000
spring.mail.properties.mail.smtp.timeout=10000
spring.mail.properties.mail.smtp.writetimeout=10000

# ============================================================
# App Settings
# ============================================================
#app.cors.allowed-origins=${CORS_ALLOWED_ORIGINS:http://localhost:5173,http://localhost:5174,http://localhost:3000}
app.cors.allowed-origins=${CORS_ALLOWED_ORIGINS:http://localhost:5173,http://localhost:5174,http://localhost:3000,https://valglobalcommodities.com,https://www.valglobalcommodities.com}





